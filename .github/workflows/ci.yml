name: CHRONYX CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ['3.10', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install Ubuntu desktop runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libnotify-bin tzdata rpm

      - name: Install timezone data for tests
        run: python -m pip install tzdata

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit npm dependencies
        if: runner.os == 'Linux' && matrix.python-version == '3.10'
        shell: bash
        run: |
          if npm audit --audit-level=high > "$RUNNER_TEMP/npm-audit.log" 2>&1; then
            status=0
          else
            status=$?
          fi
          cat "$RUNNER_TEMP/npm-audit.log"
          if [ "$status" -ne 0 ]; then
            if grep -Eiq 'ENOTFOUND|ECONN|EAI_AGAIN|ETIMEDOUT|ENETUNREACH' "$RUNNER_TEMP/npm-audit.log"; then
              echo '::warning::npm audit could not reach the registry; skipping network-only audit failure.'
            else
              exit "$status"
            fi
          fi

      - name: Audit Windows dependencies
        if: runner.os == 'Windows' && matrix.python-version == '3.10'
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements-windows.txt

      - name: Run Python tests and syntax checks
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile server.py desktop.py

      - name: Check frontend tests, types, and production build
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Fail on stale committed production assets
        if: runner.os == 'Linux'
        run: npm run build && git diff --exit-code dist

      - name: Check Linux installer shell syntax and desktop bindings
        if: runner.os == 'Linux'
        run: |
          sh -n install-user.sh uninstall-user.sh
          /usr/bin/python3 -c "import gi; gi.require_version('Gtk','3.0'); gi.require_version('WebKit2','4.1'); from gi.repository import Gtk, WebKit2"

      - name: Parse Windows PowerShell installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @('install-windows.ps1', 'uninstall-windows.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file has PowerShell parse errors: $($errors -join '; ')" }
          }

      - name: Build Fedora RPM recipe on Linux runner
        if: runner.os == 'Linux' && matrix.python-version == '3.10'
        run: |
          mkdir -p /tmp/rpmbuild/SOURCES
          tar --exclude='node_modules' --exclude='.git' --exclude='__pycache__' --exclude='.venv' --exclude='*.rpm' --transform='s,^,vanta-1.0.0/,' -czf /tmp/rpmbuild/SOURCES/vanta-1.0.0.tar.gz .
          rpmbuild -bb --define '_topdir /tmp/rpmbuild' packaging/vanta.spec
          RPM_RELEASE=$(sed -n 's/^Release:[[:space:]]*\([0-9][0-9]*\).*/\1/p' packaging/vanta.spec | head -n 1)
          RPM_FILE=$(find /tmp/rpmbuild/RPMS/noarch -name "vanta-1.0.0-${RPM_RELEASE}*.noarch.rpm" -print -quit)
          test -n "$RPM_FILE"
          rpm -qp --requires "$RPM_FILE"
