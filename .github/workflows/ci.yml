name: CHRONYX CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  application:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Ubuntu desktop runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libnotify-bin tzdata rpm

      - name: Install timezone data for tests
        run: python -m pip install tzdata

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Python tests and syntax checks
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile server.py desktop.py

      - name: Check frontend tests, types, and production build
        run: |
          npm test
          npx tsc --noEmit
          npm run build

      - name: Check Linux installer shell syntax and desktop bindings
        if: runner.os == 'Linux'
        run: |
          sh -n install-user.sh uninstall-user.sh
          /usr/bin/python3 -c "import gi; gi.require_version('Gtk','3.0'); gi.require_version('WebKit2','4.1'); from gi.repository import Gtk, WebKit2"

      - name: Parse Windows PowerShell installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @('install-windows.ps1', 'uninstall-windows.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$file has PowerShell parse errors: $($errors -join '; ')" }
          }

      - name: Build Fedora RPM recipe on Linux runner
        if: runner.os == 'Linux' && matrix.python-version == '3.10'
        run: |
          mkdir -p /tmp/rpmbuild/SOURCES
          tar --exclude='node_modules' --exclude='.git' --exclude='__pycache__' --exclude='.venv' --exclude='*.rpm' --transform='s,^,vanta-1.0.0/,' -czf /tmp/rpmbuild/SOURCES/vanta-1.0.0.tar.gz .
          rpmbuild -bb --define '_topdir /tmp/rpmbuild' packaging/vanta.spec
          RPM_FILE=$(find /tmp/rpmbuild/RPMS/noarch -name 'vanta-1.0.0-7*.noarch.rpm' -print -quit)
          test -n "$RPM_FILE"
          rpm -qp --requires "$RPM_FILE"
