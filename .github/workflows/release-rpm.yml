name: Fedora RPM release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - name: Run tests, type check, and confirm committed assets are current
        run: |
          python -m pip install tzdata
          npm ci
          python -m unittest discover -s tests -v
          npm test
          npm run typecheck
          npm run lint
          npm run format:check
          npm run build
          git diff --exit-code dist

  rpm:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - name: Install RPM build tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build frontend and Fedora RPM
        run: |
          npm ci
          npm run build
          mkdir -p "$RUNNER_TEMP/rpmbuild/SOURCES"
          tar --exclude='node_modules' --exclude='.git' --exclude='__pycache__' \
            --exclude='.venv' --exclude='*.rpm' --transform='s,^,chronyx-1.0.0/,' \
            -czf "$RUNNER_TEMP/rpmbuild/SOURCES/chronyx-1.0.0.tar.gz" .
          rpmbuild -bb --define "_topdir $RUNNER_TEMP/rpmbuild" --define 'dist .fc44' packaging/chronyx.spec
          cp "$RUNNER_TEMP"/rpmbuild/RPMS/noarch/*.rpm .
          sha256sum ./*.rpm > SHA256SUMS
      - name: Publish RPM and checksums to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.rpm SHA256SUMS --generate-notes
