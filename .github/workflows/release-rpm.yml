name: Fedora RPM release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - name: Install RPM build tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build frontend and Fedora RPM
        run: |
          npm ci
          npm run build
          mkdir -p "$RUNNER_TEMP/rpmbuild/SOURCES"
          tar --exclude='node_modules' --exclude='.git' --exclude='__pycache__' \
            --exclude='.venv' --exclude='*.rpm' --transform='s,^,vanta-1.0.0/,' \
            -czf "$RUNNER_TEMP/rpmbuild/SOURCES/vanta-1.0.0.tar.gz" .
          rpmbuild -bb --define "_topdir $RUNNER_TEMP/rpmbuild" --define 'dist .fc44' packaging/vanta.spec
          cp "$RUNNER_TEMP"/rpmbuild/RPMS/noarch/*.rpm .
          sha256sum ./*.rpm > SHA256SUMS
      - name: Publish RPM and checksums to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.rpm SHA256SUMS --generate-notes
